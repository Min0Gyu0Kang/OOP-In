<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background: #1e1e1e; color: #ddd;
            font-family: Segoe UI, Helvetica, Arial, sans-serif;
        }
        #layout { display: flex; flex-direction: column; height: 100%; }
        #toolbar {
            flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
            padding: 6px 10px; background: #252526; border-bottom: 1px solid #333;
        }
        #run {
            background: #0e639c; color: #fff; border: 0; border-radius: 3px;
            padding: 5px 14px; font-size: 13px; cursor: pointer;
        }
        #run:hover { background: #1177bb; }
        #run:disabled { background: #444; cursor: default; }
        #hint { font-size: 12px; color: #888; }
        #container { flex: 1 1 auto; min-height: 0; }
    </style>
    <!-- CDN 또는 로컬 monaco-editor 라이브러리 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
</head>
<body>
    <div id="layout">
        <div id="toolbar">
            <button id="run" disabled>Run</button>
            <span id="hint">Ctrl+Enter</span>
        </div>
        <div id="container"></div>
    </div>

    <script>
        var editor;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('container'), {
                value: "# Bridge.Plow(x, z)  Bridge.Remove(x, z)\n# Bridge.Plant(x, z, \"Carrot\")  Bridge.Harvest(x, z)\nBridge.Plow(0, 0)\nBridge.Plant(0, 0, \"Carrot\")\nBridge.Harvest(0, 0)\n",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, sendCodeToUnity);

            var run = document.getElementById('run');
            run.disabled = false;
            run.addEventListener('click', sendCodeToUnity);
        });

        // Unity C#으로 코드 본문 전달하는 브릿지 함수.
        //
        // window.Unity is provided by the native webview plugin (Android) or by the shim
        // WebViewController injects on page load (Windows/WebView2, macOS). It is defined
        // after the document loads, so it is looked up at click time, not at startup.
        //
        // encodeURIComponent is required: WebViewObject.CallFromJS URL-unescapes the whole
        // message once on the C# side, which is what turns this back into real source text
        // (newlines included). It also protects literal '&', '?' and '+' in the code.
        function sendCodeToUnity() {
            if (!editor) { return; }

            if (!window.Unity || typeof window.Unity.call !== 'function') {
                console.error('Unity bridge not available yet.');
                return;
            }

            monaco.editor.setModelMarkers(editor.getModel(), 'unity-run', []);
            var code = editor.getValue();
            window.Unity.call('run-python?code=' + encodeURIComponent(code));
        }

        // Called from Unity (MonacoBridge) when a run raises: red squiggle + hover message.
        window.markError = function (line, message) {
            if (!editor) { return; }
            var model = editor.getModel();
            line = Math.max(1, Math.min(line, model.getLineCount()));
            monaco.editor.setModelMarkers(model, 'unity-run', [{
                severity: monaco.MarkerSeverity.Error,
                message: message,
                startLineNumber: line,
                startColumn: model.getLineFirstNonWhitespaceColumn(line) || 1,
                endLineNumber: line,
                endColumn: model.getLineMaxColumn(line)
            }]);
            editor.revealLineInCenterIfOutsideViewport(line);
        };

        // --- Keys Unity forwards itself (WebViewKeyboardBridge) --------------------------
        // The native webview only receives printable text, so navigation and shortcuts
        // arrive here as named actions and are run as Monaco commands.
        function suggestVisible() {
            return !!document.querySelector('.suggest-widget.visible');
        }

        window.unityKey = function (name, shift) {
            if (!editor) { return; }
            editor.focus();
            var sel = shift ? 'Select' : '';
            var cmd = null;
            switch (name) {
                case 'left': cmd = 'cursorLeft' + sel; break;
                case 'right': cmd = 'cursorRight' + sel; break;
                case 'up': cmd = suggestVisible() ? 'selectPrevSuggestion' : 'cursorUp' + sel; break;
                case 'down': cmd = suggestVisible() ? 'selectNextSuggestion' : 'cursorDown' + sel; break;
                case 'home': cmd = 'cursorHome' + sel; break;
                case 'end': cmd = 'cursorEnd' + sel; break;
                case 'pageUp': cmd = 'cursorPageUp' + sel; break;
                case 'pageDown': cmd = 'cursorPageDown' + sel; break;
                case 'wordLeft': cmd = 'cursorWordLeft' + sel; break;
                case 'wordRight': cmd = 'cursorWordEndRight' + sel; break;
                case 'top': cmd = 'cursorTop' + sel; break;
                case 'bottom': cmd = 'cursorBottom' + sel; break;
                case 'delete': cmd = 'deleteRight'; break;
                case 'escape': cmd = 'hideSuggestWidget'; break;
                case 'undo': cmd = 'undo'; break;
                case 'redo': cmd = 'redo'; break;
                case 'selectAll': cmd = 'editor.action.selectAll'; break;
                case 'comment': cmd = 'editor.action.commentLine'; break;
                case 'run': sendCodeToUnity(); return;
            }
            if (cmd) { editor.trigger('unity', cmd, null); }
        };

        window.unityCopy = function (cut) {
            if (!editor) { return; }
            editor.focus();
            var model = editor.getModel();
            var selections = editor.getSelections();
            var text = selections.map(function (s) { return model.getValueInRange(s); }).join('\n');
            // VS Code copies the whole line when nothing is selected.
            var wholeLine = text === '';
            if (wholeLine) {
                var ln = editor.getPosition().lineNumber;
                text = model.getLineContent(ln) + '\n';
            }
            if (window.Unity && window.Unity.call) {
                window.Unity.call('clipboard?text=' + encodeURIComponent(text));
            }
            if (cut) {
                if (wholeLine) {
                    editor.trigger('unity', 'editor.action.deleteLines', null);
                } else {
                    editor.executeEdits('unity-cut', selections.map(function (s) {
                        return { range: s, text: '' };
                    }));
                }
            }
        };

        window.unityPaste = function (text) {
            if (!editor || !text) { return; }
            editor.focus();
            // Inserted as an edit, not typed, so auto-indent and auto-closing brackets
            // don't mangle multi-line code.
            text = text.replace(/\r\n/g, '\n');
            editor.pushUndoStop();
            editor.executeEdits('unity-paste', editor.getSelections().map(function (s) {
                return { range: s, text: text, forceMoveMarkers: true };
            }));
            editor.pushUndoStop();
        };
    </script>
</body>
</html>
