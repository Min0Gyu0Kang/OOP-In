<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background: #1e1e1e; color: #d4d4d4;
            font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 14px;
        }
        #layout { display: flex; flex-direction: column; height: 100%; }
        #title {
            flex: 0 0 auto; padding: 8px 14px; background: #252526; border-bottom: 1px solid #333;
            color: #fff; font-size: 15px; font-weight: 600;
        }
        #body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; line-height: 1.55; }
        p { margin: 10px 0; }
        code {
            font-family: Consolas, 'Courier New', monospace; font-size: 13px;
            background: #2d2d2d; color: #ce9178; padding: 1px 5px; border-radius: 3px;
        }
        pre {
            margin: 10px 0; padding: 10px 12px; background: #252526; border: 1px solid #333;
            border-radius: 4px; overflow-x: auto;
        }
        pre code { background: none; color: #d4d4d4; padding: 0; white-space: pre; }
        .invalid { color: #f48771; }
        #placeholder { color: #6a6a6a; }
    </style>
</head>
<body>
    <div id="layout">
        <div id="title">Stage</div>
        <div id="body"><p id="placeholder">Loading stage…</p></div>
    </div>

    <script>
        // Called from StageUIController. descriptionHtml is built and escaped on the C# side.
        window.loadStageData = function (title, descriptionHtml) {
            document.getElementById('title').textContent = title || 'Stage';
            var body = document.getElementById('body');
            body.innerHTML = descriptionHtml || '';
            body.scrollTop = 0;
        };
    </script>
</body>
</html>
