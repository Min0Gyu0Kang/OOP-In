<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background: #1e1e1e; color: #d4d4d4;
            font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px;
        }
        #layout { height: 100%; overflow-y: auto; padding: 8px 12px; box-sizing: border-box; }
        h3 { margin: 12px 0 5px; font-size: 12px; font-weight: 600; color: #9cdcfe;
             text-transform: uppercase; letter-spacing: 0.04em; }
        .io > div:first-child h3 { margin-top: 2px; }
        pre {
            margin: 0; padding: 8px 10px; background: #252526; border: 1px solid #333;
            border-radius: 4px; overflow-x: auto; min-height: 16px;
        }
        code { font-family: Consolas, 'Courier New', monospace; font-size: 13px; color: #d4d4d4; white-space: pre; }
        #commands { list-style: none; margin: 0; padding: 0; }
        #commands li { margin: 0 0 4px; }
        #commands code { display: inline-block; padding: 2px 6px; background: #252526;
                         border: 1px solid #333; border-radius: 3px; color: #dcdcaa; }
        #commands-block { display: none; }
        #invalid { display: none; margin: 4px 0 8px; color: #f48771; }
    </style>
</head>
<body>
    <div id="layout">
        <div id="invalid"></div>
        <div class="io">
            <div>
                <h3>Sample Input</h3>
                <pre><code id="sample-input"></code></pre>
            </div>
            <div>
                <h3>Sample Output</h3>
                <pre><code id="sample-output"></code></pre>
            </div>
        </div>
        <div id="commands-block">
            <h3>Helpful Commands</h3>
            <ul id="commands"></ul>
        </div>
    </div>

    <script>
        // Called from StageUIController.
        window.setSamples = function (sampleInput, sampleOutput, commands) {
            document.getElementById('sample-input').textContent = sampleInput || '';
            document.getElementById('sample-output').textContent = sampleOutput || '';

            var list = document.getElementById('commands');
            list.innerHTML = '';
            (commands || []).forEach(function (text) {
                var li = document.createElement('li');
                var code = document.createElement('code');
                code.textContent = text;
                li.appendChild(code);
                list.appendChild(li);
            });
            document.getElementById('commands-block').style.display = list.children.length ? 'block' : 'none';
        };

        window.setInvalid = function (message) {
            var el = document.getElementById('invalid');
            el.textContent = message || '';
            el.style.display = message ? 'block' : 'none';
        };
    </script>
</body>
</html>
