<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <style>
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
            background: #1e1e1e; color: #d4d4d4;
            font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px;
        }
        #layout { display: flex; flex-direction: column; height: 100%; }
        #scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 12px; }

        h3 { margin: 12px 0 5px; font-size: 12px; font-weight: 600; color: #9cdcfe;
             text-transform: uppercase; letter-spacing: 0.04em; }
        h3:first-child { margin-top: 2px; }
        pre {
            margin: 0; padding: 8px 10px; background: #252526; border: 1px solid #333;
            border-radius: 4px; overflow-x: auto; min-height: 16px;
        }
        code { font-family: Consolas, 'Courier New', monospace; font-size: 13px; color: #d4d4d4; white-space: pre; }
        .io { display: flex; gap: 10px; }
        .io > div { flex: 1 1 0; min-width: 0; }

        details { margin-top: 10px; }
        summary { cursor: pointer; color: #9cdcfe; font-size: 12px; font-weight: 600;
                  text-transform: uppercase; letter-spacing: 0.04em; }
        .test { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .test pre { flex: 1 1 auto; padding: 4px 8px; }
        .test .arrow { color: #858585; }
        .test .label { color: #858585; width: 28px; }

        #invalid { display: none; margin: 4px 0 8px; color: #f48771; }

        #stars {
            flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: center; gap: 22px;
            padding: 10px 12px 6px; background: #252526; border-top: 1px solid #333;
        }
        .star { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: default; }
        .star svg { width: 40px; height: 40px; }
        .star path { fill: none; stroke: #5a5a5a; stroke-width: 1.6; stroke-linejoin: round;
                     transition: fill 0.25s, stroke 0.25s; }
        .star .label { color: #858585; font-size: 12px; transition: color 0.25s; }
        .star.active path { fill: #f5c518; stroke: #f5c518; }
        .star.active .label { color: #f5c518; }
        .star.pop svg { animation: pop 0.45s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.6); }
            60% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        #footer { flex: 0 0 auto; display: flex; justify-content: flex-end; padding: 0 14px 8px;
                  background: #252526; min-height: 22px; }
        #next { display: none; color: #f5c518; font-size: 14px; cursor: pointer; user-select: none; }
        #next:hover { text-decoration: underline; }

        .rules { margin: 0; padding-left: 18px; line-height: 1.5; }
        .rules b { color: #f5c518; font-weight: 600; }
    </style>
</head>
<body>
    <div id="layout">
        <div id="scroll">
            <div id="invalid"></div>

            <div class="io">
                <div>
                    <h3>Sample Input</h3>
                    <pre><code id="sample-input"></code></pre>
                </div>
                <div>
                    <h3>Sample Output</h3>
                    <pre><code id="sample-output"></code></pre>
                </div>
            </div>

            <details id="tests-box">
                <summary>Test cases (<span id="test-count">0</span>)</summary>
                <div id="tests"></div>
            </details>

            <details open>
                <summary>How to earn stars</summary>
                <ol class="rules" id="rules"></ol>
            </details>
        </div>

        <div id="stars">
            <div class="star" id="star-0"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="label">cleared</span></div>
            <div class="star" id="star-1"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="label">OOP</span></div>
            <div class="star" id="star-2"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg><span class="label">O(log n)</span></div>
        </div>
        <div id="footer"><span id="next">Next →</span></div>
    </div>

    <script>
        var LABELS = ['cleared', 'OOP', 'O(log n)'];
        var hasNext = false;
        var shown = [false, false, false];
        var popTimers = [];

        function codeBlock(text) {
            var pre = document.createElement('pre');
            var code = document.createElement('code');
            code.textContent = text;
            pre.appendChild(code);
            return pre;
        }

        window.setStarRules = function (rules) {
            var list = document.getElementById('rules');
            list.innerHTML = '';
            (rules || []).forEach(function (text, i) {
                var li = document.createElement('li');
                var b = document.createElement('b');
                b.textContent = LABELS[i] + ': ';
                li.appendChild(b);
                li.appendChild(document.createTextNode(text));
                list.appendChild(li);
            });
        };

        window.setTests = function (tests) {
            var box = document.getElementById('tests');
            box.innerHTML = '';
            (tests || []).forEach(function (t) {
                var row = document.createElement('div');
                row.className = 'test';
                if (t.ctor) {
                    var c = document.createElement('span');
                    c.className = 'label';
                    c.textContent = 'new';
                    row.appendChild(c);
                    row.appendChild(codeBlock(t.ctor));
                }
                row.appendChild(codeBlock(t.args));
                var arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.textContent = '→';
                row.appendChild(arrow);
                row.appendChild(codeBlock(t.expected));
                box.appendChild(row);
            });
            document.getElementById('test-count').textContent = (tests || []).length;
        };

        window.setInvalid = function (message) {
            var el = document.getElementById('invalid');
            el.textContent = message || '';
            el.style.display = message ? 'block' : 'none';
        };

        window.setStarDetails = function (details) {
            for (var i = 0; i < 3; i++) {
                var d = details && details[i];
                document.getElementById('star-' + i).title = LABELS[i] + (d ? ': ' + d : '');
            }
        };

        window.setHasNext = function (value) {
            hasNext = !!value;
            updateNext();
        };

        function updateNext() {
            document.getElementById('next').style.display = (shown[0] && hasNext) ? 'inline' : 'none';
        }

        window.updateConditionUI = function (sampleInput, sampleOutput, star1Cleared, star2OOP, star3Optimal) {
            document.getElementById('sample-input').textContent = sampleInput || '';
            document.getElementById('sample-output').textContent = sampleOutput || '';

            popTimers.forEach(clearTimeout);
            popTimers = [];

            var target = [!!star1Cleared, !!star2OOP, !!star3Optimal];
            var delay = 0;
            target.forEach(function (on, i) {
                var el = document.getElementById('star-' + i);
                if (!on) {
                    el.classList.remove('active', 'pop');
                    shown[i] = false;
                    return;
                }
                if (shown[i]) { return; }
                shown[i] = true;
                // Newly earned stars light up one after another.
                popTimers.push(setTimeout(function () {
                    el.classList.remove('pop');
                    void el.offsetWidth;
                    el.classList.add('active', 'pop');
                }, delay));
                delay += 250;
            });
            updateNext();
        };

        document.getElementById('next').addEventListener('click', function () {
            if (window.Unity && window.Unity.call) { window.Unity.call('stage-next'); }
        });
    </script>
</body>
</html>
